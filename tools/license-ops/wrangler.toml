name = "ujima-license-ops"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

# Operator action:
#   wrangler kv:namespace create LICENSES
#   wrangler kv:namespace create LICENSES --preview
# then paste the returned ids into the bindings below.
[[kv_namespaces]]
binding = "LICENSES"
id = "<<PUT_KV_NAMESPACE_ID_HERE>>"
preview_id = "<<PUT_KV_NAMESPACE_PREVIEW_ID_HERE>>"

# Internal endpoints (POST/DELETE/GET /licenses) require a Bearer
# header equal to ADMIN_TOKEN. Set this with `wrangler secret put
# ADMIN_TOKEN` — never commit. Public endpoint (revoked.json) is
# unauthenticated by design.
[vars]
PUBLIC_REVOCATION_PATH = "/revoked.json"
