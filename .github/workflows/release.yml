name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'
  BUN_VERSION: '1.3.11'

jobs:
  # ── Build & publish npm tarball ──────────────────────────────
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build distribution
        run: bun run release:dist

      - name: Validate
        run: bun run release:smoke

      - name: Check version consistency
        run: bun run release:check

      - name: Pack tarball
        run: bun run release:pack

      - name: Publish to npm
        run: bun run release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deprecate older versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm deprecate '@ujima/agents@<'"${VERSION}" \
            "Upgrade to v${VERSION} for the latest updates"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ujima-agents-*.tgz

  # ── Build platform tarballs (matrix) ─────────────────────────
  platform-tarballs:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: darwin
            arch: x86_64
            runner: macos-latest
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest   # cross-compile or QEMU
          - os: windows
            arch: x86_64
            runner: windows-latest
          - os: windows
            arch: arm64
            runner: windows-latest  # npm install under x64 emulation
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dist
        run: bun run release:dist

      - name: Vendor rg and fd
        run: bash scripts/vendor-binaries.sh ${{ matrix.os }} ${{ matrix.arch }}

      - name: Assemble platform tarball
        run: bun scripts/release/assemble-platform-tarballs.ts ${{ matrix.os }} ${{ matrix.arch }}

      - name: Upload platform tarball
        uses: actions/upload-artifact@v4
        with:
          name: ujima-${{ matrix.os }}-${{ matrix.arch }}-tarball
          path: |
            packages/distribution/dist/platform-tarballs/ujima-*.tar.gz*
            packages/distribution/dist/platform-tarballs/ujima-*.zip*

  # ── GitHub Release ───────────────────────────────────────────
  github-release:
    needs: [npm, platform-tarballs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Windows tarballs for Winget manifest
        uses: actions/download-artifact@v4
        with:
          pattern: ujima-windows-*-tarball
          path: winget-artifacts
          merge-multiple: true

      - name: Generate Winget manifest
        id: winget
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          # Generate the manifest using the platform tarball sha256 files
          TARBALLS_DIR=winget-artifacts \
            bun scripts/release/generate-winget-manifest.ts \
            > .github/winget/ujima-agents.installer.yaml
          echo "Winget manifest generated for v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            artifacts/**/ujima-agents-*.tgz
            artifacts/**/ujima-*.tar.gz
            artifacts/**/ujima-*.tar.gz.sha256
            artifacts/**/ujima-*.zip
            artifacts/**/ujima-*.zip.sha256
            .github/winget/ujima-agents.installer.yaml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Docker build & push ─────────────────────────────────────
  docker:
    needs: [platform-tarballs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download linux/amd64 tarball
        uses: actions/download-artifact@v4
        with:
          name: ujima-linux-x86_64-tarball
          path: docker-build

      - name: Download linux/arm64 tarball
        uses: actions/download-artifact@v4
        with:
          name: ujima-linux-arm64-tarball
          path: docker-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            UJIMA_VERSION=${{ steps.version.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
