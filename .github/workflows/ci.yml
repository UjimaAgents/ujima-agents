name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce PR size limit
        env:
          MAX_LINES: 2000
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-pr-size.sh

  ci:
    runs-on: ubuntu-latest
    env:
      UJIMA_TELEGRAM_POLLING: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          cache: true

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vendor CLI binaries
        run: bash scripts/vendor-binaries.sh linux x86_64

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test:ci

  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      pack: ${{ steps.filter.outputs.pack }}
      vsix: ${{ steps.filter.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pack:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/release/**'
              - 'package.json'
              - 'bun.lock'
            vsix:
              - 'apps/vscode-extension/**'
              - 'packages/webview/**'

  verify-pack:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.pack == 'true'
    needs: [ci, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          cache: true

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify distribution pack (README, next, ujima start)
        run: |
          bun run release:dist
          bun run release:e2e

  package-vsix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.vsix == 'true'
    needs: [ci, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          cache: true

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package VSIX
        run: bun --filter ujima-vscode-extension package

      - uses: actions/upload-artifact@v4
        with:
          name: ujima-vsix
          path: apps/vscode-extension/*.vsix
          if-no-files-found: error