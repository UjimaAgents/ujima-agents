name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce PR size limit
        env:
          MAX_LINES: 2000
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-pr-size.sh

  build:
    runs-on: ubuntu-latest
    env:
      UJIMA_TELEGRAM_POLLING: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Force Sync and Commit Lockfile on Runner
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun install --no-frozen-lockfile
          git add bun.lock || true
          git diff-index --quiet HEAD || git commit -m "chore: sync lockfile on runner"

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Verify distribution pack (README, next, ujima start)
        run: |
          bun run release:dist
          bun run release:e2e

      - name: Package VSIX
        run: bun --filter ujima-vscode-extension package

      - uses: actions/upload-artifact@v4
        with:
          name: ujima-vsix
          path: apps/vscode-extension/*.vsix
          if-no-files-found: error