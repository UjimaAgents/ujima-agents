name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce PR size limit
        env:
          MAX_LINES: 2000
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-pr-size.sh

  # Single install step that the rest of the gating jobs share via
  # cache. node_modules + .turbo + vendored platform binaries all
  # land in restorable caches keyed on lockfile / script content.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          cache: true

      - name: Cache node_modules
        id: node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: steps.node_modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Cache vendored binaries
        id: vendor_bin
        uses: actions/cache@v4
        with:
          path: packages/orchestrator/bin
          key: vendor-bin-linux-x86_64-${{ hashFiles('scripts/vendor-binaries.sh') }}

      - name: Vendor CLI binaries
        if: steps.vendor_bin.outputs.cache-hit != 'true'
        run: bash scripts/vendor-binaries.sh linux x86_64

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}
          restore-keys: |
            turbo-lint-${{ runner.os }}-
            turbo-${{ runner.os }}-
      - run: bun run lint

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-
            turbo-${{ runner.os }}-
      - run: bun run typecheck

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: packages/orchestrator/bin
          key: vendor-bin-linux-x86_64-${{ hashFiles('scripts/vendor-binaries.sh') }}
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}
          restore-keys: |
            turbo-build-${{ runner.os }}-
            turbo-${{ runner.os }}-
      - run: bun run build
      - name: Upload package dist
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: packages/*/dist
          if-no-files-found: error

  # Unit tests gate PR merges. Sharded so the wall-clock per shard
  # is roughly half the unsharded test job. Integration tests live
  # in the integration job below and DON'T gate PRs.
  test-unit:
    needs: [install, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: packages/orchestrator/bin
          key: vendor-bin-linux-x86_64-${{ hashFiles('scripts/vendor-binaries.sh') }}
      - uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: .
      - run: |
          bunx vitest run \
            --minWorkers=1 --maxWorkers=4 \
            --exclude '**/*.int.test.ts' \
            --exclude '**/*.integration.test.ts' \
            --shard=${{ matrix.shard }}/2

  # Integration tests. Runs:
  #   * On every push to main
  #   * When a PR has the `run-integration` label
  #   * Nightly via the scheduled workflow (see schedule below)
  # They do NOT gate PR merges by default — flip the label when a
  # change actually touches integration-sensitive paths.
  test-integration:
    needs: [install, build]
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-integration'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: packages/orchestrator/bin
          key: vendor-bin-linux-x86_64-${{ hashFiles('scripts/vendor-binaries.sh') }}
      - uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: .
      - run: bun run test:integration:ci

  # PR-blocking gate: collapses the parallel jobs into one required
  # status check. GitHub branch protection only needs to require
  # this single job; if any of the upstream jobs fail, this one
  # fails too.
  ci:
    needs: [lint, typecheck, build, test-unit]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All gating jobs passed."

  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      pack: ${{ steps.filter.outputs.pack }}
      vsix: ${{ steps.filter.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pack:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/release/**'
              - 'package.json'
              - 'bun.lock'
            vsix:
              - 'apps/vscode-extension/**'
              - 'packages/webview/**'

  verify-pack:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.pack == 'true'
    needs: [ci, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          cache: true

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify distribution pack (README, next, ujima start)
        run: |
          bun run release:dist
          bun run release:e2e

  package-vsix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.vsix == 'true'
    needs: [ci, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          cache: true

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package VSIX
        run: bun --filter ujima-vscode-extension package

      - uses: actions/upload-artifact@v4
        with:
          name: ujima-vsix
          path: apps/vscode-extension/*.vsix
          if-no-files-found: error
